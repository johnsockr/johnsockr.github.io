<title>cjsync</title>
<h1>cjsync</h1>
<p>cjsync is a personal file sync tool.</p>
<h2>Privacy</h2>
<p>cjsync uses Google Drive access only to sync files between your own computers and your own Google Drive. It collects no data and shares nothing with anyone else. Login tokens stay on your device.</p>
